type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  - userId
  - createdAt
  - updatedAt

properties:
  _id:
    type: string
    description: Contact id
  name:
    type: string
    description: Contact name
  phoneNumber:
    type: string
    description: Contact phone number
  email:
    type: string
    description: Contact email
  isFavourite:
    type: boolean
    description: Is contact favourite
    default: false
  contactType:
    type: string
    description: Contact type
    enum: [work, home, personal]
  userId:
    type: string
    description: Contact owner id
  photo:
    type: string
    format: url
    description: Contact photo url
  createdAt:
    type: string
    format: date-time
    description: Contact created at
  updatedAt:
    type: string
    format: date-time
    description: Contact updated at
