type: object
required:
  - _id
  - name
  - email
  - createdAt
  - updatedAt

properties:
  _id:
    type: string
    description: User id
  name:
    type: string
    description: User name
  email:
    type: string
    description: User email
  createdAt:
    type: string
    format: date-time
    description: User created at
  updatedAt:
    type: string
    format: date-time
    description: User updated at
